services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: docencia_dev
      POSTGRES_USER: docencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docencia_local_dev_only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - docencia_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docencia -d docencia_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_DRIVER: pg
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql://docencia:${POSTGRES_PASSWORD:-docencia_local_dev_only}@db:5432/docencia_dev
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-}
      TEACHER_SESSION_SECRET: ${TEACHER_SESSION_SECRET:-}
      EXAM_UNLOCK_PASSWORD: ${EXAM_UNLOCK_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - .:/app
      - docencia_node_modules:/app/node_modules
      - docencia_next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  docencia_pgdata:
  docencia_node_modules:
  docencia_next_cache:
